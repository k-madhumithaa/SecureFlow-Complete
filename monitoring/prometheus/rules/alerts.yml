
groups:
  - name: secureflow-alerts
    rules:
      - alert: SecureFlowAPIDown
        expr: up{job=~"secureflow-staging|secureflow-production"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SecureFlow API is unavailable"
          description: "{{ $labels.job }} has been unreachable for more than one minute."

      - alert: HighAPIErrorRate
        expr: |
          (
            sum(rate(secureflow_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(secureflow_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SecureFlow API error rate is high"
          description: "More than 5% of API requests are returning server errors."

      - alert: HighAPIRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(secureflow_http_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SecureFlow API response time is high"
          description: "The 95th percentile API response time is above one second."
